<!doctype html>
<html><head><meta charset="utf-8"><title>FB cover - evergreen</title>
<link rel="stylesheet" href="poster.css">
<style>
  /* 1640x624 evergreen cover for between events. Key content inside the mobile-safe centre (x 265-1375). */
  .canvas { width: 1640px; height: 624px; --gx: 72%; }
  .g1 { font-size: 400px; left: -40px; top: -30px; }
  .g2 { font-size: 250px; left: 20px; top: 330px; }
  .slash { left: 900px; top: -60px; width: 34px; height: 760px; }
  .slash.s2 { left: 955px; width: 12px; opacity: .6; }
  .fighters { right: 0; bottom: 118px; width: 760px; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .floor { right: 80px; bottom: 100px; width: 760px; }
  .copy { position: absolute; left: 290px; top: 30px; z-index: 2; }
  .brandlock .mark { height: 140px; }
  .brandlock .wm { height: 74px; }
  h1 { margin-top: 16px; font-size: 112px; }
  .stats { margin-top: 18px; font-size: 18px; }
  .partners { height: 118px; gap: 22px; }
  .partners .p { height: 92px; }
  .partners .label { font-size: 15px; }
</style></head>
<body>
<div class="canvas">
  <div class="arena"></div><div class="beams"></div><div class="haze"></div><div class="halftone"></div>
  <div class="ghost g1">Savage</div>
  <div class="ghost fill g2">Grappling</div>
  <div class="slash"></div><div class="slash s2"></div>
  <div class="floor"></div>
  <img class="fighters" src="../assets/cutouts/armbar.png" alt="">
  <div class="copy">
    <div class="brandlock">
      <img class="mark" src="../assets/logo/sg-mark-white.svg" alt="">
      <img class="wm" src="../assets/logo/wordmark-white.svg" alt="Savage Grappling">
    </div>
    <h1 class="display">Prove it<br><span class="blue">on the mats</span></h1>
    <div class="score stats"><div class="b">556 athletes</div><div>20+ events</div><div>3–4 matches each</div></div>
  </div>
  <div class="partners">
    <span class="label">Official partners</span>
    <div class="p"><img src="../assets/sponsors/cycon.png" alt="Cycon Civil"></div>
    <div class="p"><img src="../assets/sponsors/ajjfr.png" alt="AJJFP"></div>
    <div class="p"><img src="../assets/sponsors/kamikaze.png" alt="Kamikaze Energy"></div>
  </div>
  <div class="vignette"></div><div class="grain"></div>
</div>
</body></html>
