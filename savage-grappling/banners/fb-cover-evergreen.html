<!doctype html>
<html><head><meta charset="utf-8"><title>FB cover - evergreen</title>
<link rel="stylesheet" href="../brand.css">
<style>
  /* 1640x624 evergreen cover for between events. Text kept inside the mobile-safe centre (x 265-1375). */
  .canvas { width: 1640px; height: 624px; }
  .photo { left: 700px; background-image: url(../assets/photo-armbar.jpg); background-position: 30% 60%; }
  .fade { position: absolute; inset: 0; background:
      linear-gradient(90deg, var(--ink) 0 700px, rgba(7,8,12,.85) 760px, rgba(7,8,12,.2) 980px, rgba(7,8,12,0) 1150px),
      linear-gradient(0deg, rgba(7,8,12,.8), rgba(7,8,12,0) 40%); }
  .glow { position: absolute; left: 160px; top: -220px; width: 720px; height: 720px; border-radius: 50%;
      background: radial-gradient(circle, rgba(43,78,245,.25), rgba(43,78,245,0) 65%); }
  .copy { position: absolute; left: 300px; top: 74px; width: 700px; }
  .wm { height: 46px; display: block; margin-bottom: 26px; }
  h1 { font-size: 138px; }
  .sub { margin-top: 22px; font-family: var(--display); font-weight: 700; font-style: italic; font-size: 38px; text-transform: uppercase; letter-spacing: .01em; }
  .stats { margin-top: 26px; font-size: 22px; }
  .tapeline { position: absolute; left: 0; right: 0; bottom: 0; }
  .url { position: absolute; right: 290px; bottom: 40px; font-size: 18px; color: var(--chalk); }
</style></head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="copy">
    <img class="wm" src="../assets/wordmark-white.png" alt="Savage Grappling">
    <h1 class="display">Prove it<br><span class="blue">on the mats</span></h1>
    <div class="sub">Gi &amp; No-Gi round robin · Melbourne</div>
    <div class="score stats"><div class="b">500+ athletes / event</div><div>20+ events</div><div>3–4 matches each</div></div>
  </div>
  <div class="label url">savagegrappling.com.au</div>
  <div class="tape tapeline"></div>
</div>
</body></html>
