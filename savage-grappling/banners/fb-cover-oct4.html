<!doctype html>
<html><head><meta charset="utf-8"><title>FB cover - Oct 4</title>
<link rel="stylesheet" href="../brand.css">
<style>
  /* 1640x624. Facebook mobile crops to the centre ~1110px (x 265-1375), so all text sits inside that. */
  .canvas { width: 1640px; height: 624px; }
  .photo { left: 640px; background-image: url(../assets/photo-takedown.jpg); background-position: 18% 40%; }
  .fade { position: absolute; inset: 0; background:
      linear-gradient(90deg, var(--ink) 0 640px, rgba(7,8,12,.92) 700px, rgba(7,8,12,.35) 900px, rgba(7,8,12,0) 1100px),
      linear-gradient(0deg, rgba(7,8,12,.85), rgba(7,8,12,0) 45%); }
  .glow { position: absolute; left: 150px; top: -200px; width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(43,78,245,.28), rgba(43,78,245,0) 65%); }
  .copy { position: absolute; left: 300px; top: 70px; width: 640px; }
  .wm { height: 46px; display: block; margin-bottom: 26px; }
  h1 { font-size: 138px; }
  .meta { margin-top: 26px; display: flex; align-items: center; gap: 22px; }
  .date { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 52px; text-transform: uppercase; }
  .date b { color: var(--volt); }
  .venue { font-size: 22px; color: var(--mute); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; line-height: 1.25; }
  .row { margin-top: 24px; display: flex; gap: 14px; align-items: center; }
  .cta { font-size: 34px; }
  .chip { font-size: 16px; }
  .tapeline { position: absolute; left: 0; right: 0; bottom: 0; }
  .sponsors { position: absolute; right: 290px; bottom: 34px; width: 300px; opacity: .95; }
  .spon-label { position: absolute; right: 290px; bottom: 102px; font-size: 13px; color: var(--mute); }
  .scoreboard { position: absolute; right: 290px; top: 60px; font-size: 20px; }
</style></head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <div class="photo"></div>
  <div class="fade"></div>
  <div class="copy">
    <img class="wm" src="../assets/wordmark-white.png" alt="Savage Grappling">
    <h1 class="display">Prove it<br><span class="blue">on the mats</span></h1>
    <div class="meta">
      <div class="date">Sun <b>4 Oct</b></div>
      <div class="venue">Deakin Uni Stadium<br>Burwood, Melbourne</div>
    </div>
    <div class="row">
      <div class="cta"><span>Enter on Smoothcomp</span></div>
      <div class="chip">3–4 matches guaranteed</div>
    </div>
  </div>
  <div class="score scoreboard"><div class="r">Entries close</div><div>Fri 2 Oct · 10:00</div></div>
  <div class="label spon-label">Supported by</div>
  <img class="sponsors" src="../assets/sponsors-strip.png" alt="Cycon Civil, AJJFR, Kamikaze Energy">
  <div class="tape tapeline"></div>
</div>
</body></html>
